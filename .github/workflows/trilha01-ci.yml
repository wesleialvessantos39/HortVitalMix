name: HortiVitalMix Trilha 01 CI

on:
  push:
    branches:
      - main
      - trilha01-volume01-impl
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Generate deterministic lockfile when absent
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install from lockfile
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and contract tests
        run: npm run test

      - name: Client secret boundary
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Upload lockfile and build evidence
        uses: actions/upload-artifact@v4
        with:
          name: trilha01-ci-evidence
          path: |
            package-lock.json
            dist/
          if-no-files-found: error
          retention-days: 7
