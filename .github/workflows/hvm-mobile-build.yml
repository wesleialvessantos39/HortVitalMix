name: HortiVitalMix — Android e iOS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hvm-mobile-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  HVM_NATIVE_BACKEND_ORIGIN: ${{ vars.HVM_NATIVE_BACKEND_ORIGIN || 'https://hortvitalmix.vercel.app' }}
  BUILD_NUMBER: ${{ github.run_number }}
  BUILD_VERSION: 1.0.${{ github.run_number }}

jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      native_required: ${{ steps.plan.outputs.native_required }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packaging/capacitor/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm ci --prefix packaging/capacitor --no-audit --no-fund
      - run: node --test scripts/mobile/native-pipeline.test.mjs scripts/mobile/web-sync.test.mjs
      - id: plan
        env:
          HVM_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HVM_PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: node scripts/mobile/native-plan.mjs
      - name: Prepare installed-version identity and runtime fingerprint
        run: node scripts/mobile/native-build.mjs prepare "$BUILD_NUMBER" "$BUILD_VERSION"
      - name: Build bundled web with all existing gates
        shell: bash
        run: |
          set -euo pipefail
          export VITE_HVM_NATIVE_BACKEND_ORIGIN="$HVM_NATIVE_BACKEND_ORIGIN"
          export VITE_HVM_NATIVE_RUNTIME_HASH="$(node scripts/mobile/native-build.mjs fingerprint)"
          npm run build
          cp packaging/capacitor/native-build.json dist/native-build.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.plan.outputs.native_required == 'true'
        with:
          name: native-web-${{ github.run_id }}
          path: dist/
          overwrite: true
          retention-days: 3
          if-no-files-found: error

  web_sync:
    needs: web
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: mobile-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Wait for the canonical Vercel deployment and synchronize its web release
        run: node scripts/mobile/sync-web-release.mjs

  android_verify:
    needs: web
    if: needs.web.outputs.native_required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: packaging/capacitor/package-lock.json
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --prefix packaging/capacitor --no-audit --no-fund
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: native-web-${{ github.run_id }}
          path: dist/
      - run: node scripts/mobile/native-build.mjs prepare "$BUILD_NUMBER" "$BUILD_VERSION"
      - run: npx cap sync android
        working-directory: packaging/capacitor
      - name: Install the Android SDK used by the committed project
        run: >-
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Compile unsigned APK and AAB for validation
        run: ./gradlew --no-daemon :app:assembleRelease :app:bundleRelease :app:lintRelease
        working-directory: packaging/capacitor/android
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-unsigned-${{ github.run_id }}
          path: |
            packaging/capacitor/android/app/build/outputs/apk/release/app-release-unsigned.apk
            packaging/capacitor/android/app/build/outputs/bundle/release/app-release.aab
            packaging/capacitor/native-build.json
          overwrite: true
          retention-days: 3
          if-no-files-found: error

  ios_verify:
    needs: web
    if: needs.web.outputs.native_required == 'true'
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: packaging/capacitor/package-lock.json
      - run: npm ci --prefix packaging/capacitor --no-audit --no-fund
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: native-web-${{ github.run_id }}
          path: dist/
      - run: node scripts/mobile/native-build.mjs prepare "$BUILD_NUMBER" "$BUILD_VERSION"
      - run: npx cap sync ios
        working-directory: packaging/capacitor
      - name: Compile iOS simulator; this is not an installable IPA
        run: >-
          xcodebuild -project packaging/capacitor/ios/App/App.xcodeproj -scheme App
          -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/hvm-ios-simulator" CODE_SIGNING_ALLOWED=NO build

  android_release:
    needs: [web, web_sync, android_verify, ios_verify]
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      vars.HVM_ANDROID_RELEASE_ENABLED == 'true' && vars.HVM_ANDROID_NATIVE_VERIFIED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: mobile-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: android-unsigned-${{ github.run_id }}
          path: packaging/capacitor/
      - name: Install signing tools on this fresh runner
        run: >-
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;36.0.0'
      - name: Sign and verify the real APK and AAB
        shell: bash
        env:
          HVM_ANDROID_KEYSTORE_BASE64: ${{ secrets.HVM_ANDROID_KEYSTORE_BASE64 }}
          HVM_STORE_PASSWORD: ${{ secrets.HVM_ANDROID_KEYSTORE_PASSWORD }}
          HVM_ANDROID_KEY_ALIAS: ${{ secrets.HVM_ANDROID_KEY_ALIAS }}
          HVM_KEY_PASSWORD: ${{ secrets.HVM_ANDROID_KEY_PASSWORD }}
          HVM_ANDROID_CERTIFICATE_SHA256: ${{ vars.HVM_ANDROID_CERTIFICATE_SHA256 }}
        run: |
          set -euo pipefail
          test -n "$HVM_ANDROID_KEYSTORE_BASE64" && test -n "$HVM_STORE_PASSWORD" && test -n "$HVM_ANDROID_KEY_ALIAS" && test -n "$HVM_KEY_PASSWORD"
          umask 077
          trap 'rm -f "$RUNNER_TEMP/hvm-release.jks"' EXIT
          printf '%s' "$HVM_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/hvm-release.jks"
          mkdir -p packaging/capacitor/release-assets
          TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          "$TOOLS/aapt" dump badging packaging/capacitor/android/app/build/outputs/apk/release/app-release-unsigned.apk > "$RUNNER_TEMP/hvm-apk-badging.txt"
          node scripts/mobile/android-package-proof.mjs "$RUNNER_TEMP/hvm-apk-badging.txt"
          "$TOOLS/zipalign" -f 4 packaging/capacitor/android/app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/hvm-aligned.apk"
          "$TOOLS/apksigner" sign --ks "$RUNNER_TEMP/hvm-release.jks" --ks-key-alias "$HVM_ANDROID_KEY_ALIAS" --ks-pass env:HVM_STORE_PASSWORD --key-pass env:HVM_KEY_PASSWORD --out packaging/capacitor/release-assets/HortiVitalMix.apk "$RUNNER_TEMP/hvm-aligned.apk"
          "$TOOLS/apksigner" verify --verbose --print-certs packaging/capacitor/release-assets/HortiVitalMix.apk > "$RUNNER_TEMP/hvm-apk-signature.txt"
          node scripts/mobile/cert-proof.mjs "$RUNNER_TEMP/hvm-apk-signature.txt" > packaging/capacitor/release-assets/signing-identity.txt
          jarsigner -keystore "$RUNNER_TEMP/hvm-release.jks" -storepass:env HVM_STORE_PASSWORD -keypass:env HVM_KEY_PASSWORD -signedjar packaging/capacitor/release-assets/HortiVitalMix.aab packaging/capacitor/android/app/build/outputs/bundle/release/app-release.aab "$HVM_ANDROID_KEY_ALIAS"
          jarsigner -verify packaging/capacitor/release-assets/HortiVitalMix.aab
          sha256sum packaging/capacitor/release-assets/HortiVitalMix.apk packaging/capacitor/release-assets/HortiVitalMix.aab > packaging/capacitor/release-assets/SHA256SUMS
      - name: Upload verified APK and synchronize the Supabase release ledger
        env:
          HVM_MOBILE_CI_ORIGIN: ${{ vars.HVM_MOBILE_CI_ORIGIN || 'https://hortvitalmix.vercel.app' }}
          HVM_MIN_SUPPORTED_BUILD: ${{ vars.HVM_MIN_SUPPORTED_ANDROID_BUILD || '1' }}
        run: node scripts/mobile/publish-release.mjs android packaging/capacitor/release-assets/HortiVitalMix.apk packaging/capacitor/release-assets/signing-identity.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-signed-${{ github.run_id }}
          path: packaging/capacitor/release-assets/
          overwrite: true
          retention-days: 7
          if-no-files-found: error

  ios_release:
    needs: [web, web_sync, android_verify, ios_verify]
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      vars.HVM_IOS_RELEASE_ENABLED == 'true' && vars.HVM_IOS_NATIVE_VERIFIED == 'true'
    runs-on: macos-26
    timeout-minutes: 60
    environment: mobile-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm ci --prefix packaging/capacitor --no-audit --no-fund
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: native-web-${{ github.run_id }}
          path: dist/
      - run: node scripts/mobile/native-build.mjs prepare "$BUILD_NUMBER" "$BUILD_VERSION"
      - run: npx cap sync ios
        working-directory: packaging/capacitor
      - name: Archive, export, verify and upload to Apple
        shell: bash
        env:
          HVM_APPLE_CERT_P12_BASE64: ${{ secrets.HVM_APPLE_CERT_P12_BASE64 }}
          HVM_APPLE_CERT_PASSWORD: ${{ secrets.HVM_APPLE_CERT_PASSWORD }}
          HVM_APPLE_API_KEY_P8_BASE64: ${{ secrets.HVM_APPLE_API_KEY_P8_BASE64 }}
          HVM_APPLE_API_KEY_ID: ${{ secrets.HVM_APPLE_API_KEY_ID }}
          HVM_APPLE_API_ISSUER_ID: ${{ secrets.HVM_APPLE_API_ISSUER_ID }}
          HVM_APPLE_TEAM_ID: ${{ vars.HVM_APPLE_TEAM_ID }}
        run: bash scripts/mobile/ios-release.sh
      - name: Register the uploaded iOS build for official-channel approval
        env:
          HVM_MOBILE_CI_ORIGIN: ${{ vars.HVM_MOBILE_CI_ORIGIN || 'https://hortvitalmix.vercel.app' }}
          HVM_MIN_SUPPORTED_BUILD: ${{ vars.HVM_MIN_SUPPORTED_IOS_BUILD || '1' }}
          HVM_APPLE_TEAM_ID: ${{ vars.HVM_APPLE_TEAM_ID }}
          HVM_IOS_DISTRIBUTION_URL: ${{ vars.HVM_IOS_DISTRIBUTION_URL }}
        run: node scripts/mobile/publish-release.mjs ios packaging/capacitor/release-assets/HortiVitalMix.ipa
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-signed-private-${{ github.run_id }}
          path: packaging/capacitor/release-assets/
          overwrite: true
          retention-days: 7
          if-no-files-found: error
