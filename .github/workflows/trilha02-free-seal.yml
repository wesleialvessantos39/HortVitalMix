name: Trilha 02 - Selagem gratuita

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/trilha02-free-seal.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  homologacao-local:
    name: Homologacao local - ${{ matrix.app_env }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        app_env: [development, homologation]

    env:
      APP_ENV: ${{ matrix.app_env }}
      HVM_PROD_PROJECT_REF: xipbsazvymkqqfmfegwu
      HVM_INTEGRATION_ENABLED: "true"
      APP_IP_PEPPER: 0123456789abcdef0123456789abcdef
      OUTBOX_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      APP_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      DATABASE_SSL_STRICT: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Iniciar Supabase local
        run: npx supabase start

      - name: Criar snapshot logico pre-Trilha 02
        shell: bash
        run: |
          set -euo pipefail
          npx supabase db reset --local --version 20260920224820 --no-seed
          SNAPSHOT="$RUNNER_TEMP/trilha02-${APP_ENV}-pre-20260921193244.sql"
          npx supabase db dump --local --file "$SNAPSHOT" --keep-comments
          SNAPSHOT_SHA="$(sha256sum "$SNAPSHOT" | awk '{print $1}')"
          echo "T02_SNAPSHOT_ENV=${APP_ENV}"
          echo "T02_SNAPSHOT_SHA256=${SNAPSHOT_SHA}"
          echo "### Snapshot logico pre-T02 - ${APP_ENV}" >> "$GITHUB_STEP_SUMMARY"
          echo "\`sha256:${SNAPSHOT_SHA}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Aplicar migration da Trilha 02
        run: npx supabase migration up --local

      - name: Exportar runtime local isolado
        shell: bash
        run: |
          set -euo pipefail
          eval "$(npx supabase status -o env)"
          {
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_ANON_KEY=$ANON_KEY"
            echo "VITE_SUPABASE_URL=$API_URL"
            echo "VITE_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "SUPABASE_DB_URL=$DB_URL"
            echo "SUPABASE_PROJECT_REF=local-${APP_ENV}"
          } >> "$GITHUB_ENV"

      - name: Verificar manifesto e evidencia estatica
        run: |
          npm run migrations:verify
          npm run verify:t02:evidence

      - name: Gate de fundacao A1-A18
        run: npm run verify:foundation

      - name: Testes Trilha 02 - 31 casos
        run: npm run test:t02

      - name: Build de producao
        run: npm run build

      - name: Registrar release efemera
        shell: bash
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA:0:7}"
          if [ "$APP_ENV" = "development" ]; then SUFFIX="dev"; else SUFFIX="hml"; fi
          npm run release:current --             --tag="trilha02-v1-${SUFFIX}-${SHORT_SHA}"             --environment="$APP_ENV"             --sha="$GITHUB_SHA"             --by="github-actions-free"             --notes="Homologacao efemera gratuita da Trilha 02"

      - name: Encerrar Supabase local
        if: always()
        run: npx supabase stop --no-backup

  selagem:
    name: Selar tag apos Vercel READY
    runs-on: ubuntu-latest
    needs: homologacao-local
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aguardar status Vercel do mesmo SHA
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          STATE=""
          TARGET=""
          for attempt in $(seq 1 40); do
            JSON="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/status")"
            STATE="$(printf '%s' "$JSON" | jq -r '[.statuses[] | select(.context=="Vercel")][0].state // empty')"
            TARGET="$(printf '%s' "$JSON" | jq -r '[.statuses[] | select(.context=="Vercel")][0].target_url // empty')"
            echo "Vercel attempt ${attempt}: ${STATE:-pending}"
            if [ "$STATE" = "success" ]; then
              echo "VERCEL_READY_TARGET=$TARGET"
              exit 0
            fi
            if [ "$STATE" = "failure" ] || [ "$STATE" = "error" ]; then
              exit 1
            fi
            sleep 15
          done
          echo "Vercel nao confirmou success no prazo do gate."
          exit 1

      - name: Criar tag Git trilha02-v1
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "HortiVitalMix Release Bot"
          git config user.email "actions@users.noreply.github.com"

          if git ls-remote --exit-code --tags origin refs/tags/trilha02-v1 >/dev/null 2>&1; then
            git fetch --tags origin
            EXISTING="$(git rev-list -n 1 trilha02-v1)"
            test "$EXISTING" = "$GITHUB_SHA"
            echo "Tag trilha02-v1 ja existe e aponta para o SHA correto."
            exit 0
          fi

          git tag -a trilha02-v1 -m "Trilha 02 - Configuracao Global Revisionada e Auditoria Imutavel

Homologacao gratuita: Supabase local efemero em development e homologation.
Gates: 31 casos T02, verify:foundation A1-A18, build e Vercel success.
Production: projeto Supabase canonico preservado sem fixtures destrutivas."
          git push origin refs/tags/trilha02-v1
