name: HortiVitalMix CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: hvm-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HVM_INTEGRATION_ENABLED: "false"
      APP_ENV: development
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Verify migration manifest
        run: npm run migrations:verify

      - name: Typecheck
        run: npm run typecheck

      - name: Trilha 02 safe suite
        run: npm run test:t02

      - name: Build
        run: npm run build
