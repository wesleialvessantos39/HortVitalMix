name: HortiVitalMix CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    name: OE-001 foundation validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Runner handshake
        run: |
          echo "runner=online"
          uname -a

      - name: Checkout
        uses: actions/checkout@v4

      - name: Runtime versions
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm run test

      - name: Production build
        run: npm run build
