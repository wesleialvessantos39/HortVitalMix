name: HortiVitalMix CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: hortivitalmix-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    name: OE-001 foundation validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Runner handshake
        run: |
          echo "runner=online"
          uname -a

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm run test

      - name: Production build
        run: npm run build
