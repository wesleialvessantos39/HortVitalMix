name: HortiVitalMix CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    name: OE-001 foundation validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Runner handshake
        run: |
          echo "runner=online"
          uname -a

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm run test

      - name: Production build
        run: npm run build
